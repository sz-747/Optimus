[package]
name = "optimus-shell"
version = "0.1.0"
edition = "2021"
description = "Optimus — capacity-aware terminal multiplexer (Tauri shell)"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.optimus_engine]
path = "../engine"

[package]
name = "optimus_engine"
version = "0.1.0"
edition = "2021"
description = "Optimus terminal engine — ConPTY lifecycle + OSC-99 sniffer (VT rendering lives in the webview via xterm.js)"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }

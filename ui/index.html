<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Optimus</title>
  <link rel="stylesheet" href="./tokens.css" />
  <style>
    /* Shell layout: workspace sidebar | (terminals area + always-visible capacity bar). */
    body { display: flex; flex-direction: row; }
    #workarea { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    /* Split-tree surface (P4.2): panes absolutely positioned by their normalized rects; keyed
       by surface id and moved (never recreated) on relayout so scrollback survives a split. */
    #app { position: relative; flex: 1; min-height: 0; background: var(--surface-0); overflow: hidden; }

    /* Workspace sidebar (DESIGN.md thesis chrome). */
    #sidebar {
      flex-shrink: 0; width: 220px; display: flex; flex-direction: column;
      background: var(--surface-1); border-right: 1px solid var(--hairline); overflow-y: auto;
    }
    .sb-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--sm) var(--md); border-bottom: 1px solid var(--hairline);
    }
    .sb-heading { font-size: var(--fs-meta); letter-spacing: 0.05em; color: var(--text-muted); text-transform: uppercase; }
    .sb-new, .sb-close {
      border: none; background: transparent; color: var(--text-muted);
      cursor: pointer; font-size: var(--fs-body); line-height: 1; padding: 0 var(--2xs);
    }
    .sb-new:hover, .sb-close:hover { color: var(--text-primary); }
    .sb-list { display: flex; flex-direction: column; }
    .sb-row {
      position: relative; display: flex; align-items: center; gap: var(--sm);
      padding: var(--sm) var(--md); border-left: 3px solid var(--id);
      cursor: pointer; transition: background var(--t-micro) var(--ease-out);
    }
    .sb-row:hover { background: var(--surface-2); }
    .sb-row.selected { background: var(--surface-selected); }
    .sb-main { flex: 1; min-width: 0; }
    .sb-name { font-size: var(--fs-body); color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sb-meta { display: flex; flex-wrap: wrap; gap: var(--2xs); margin-top: 2px; font-size: var(--fs-caption); }
    .sb-git { color: var(--git-branch); }
    .sb-git.dirty::after { content: "●"; color: var(--git-dirty); margin-left: 2px; }
    .sb-pr { color: var(--pr-open); }
    .sb-pr.merged { color: var(--pr-merged); }
    .sb-pr.closed { color: var(--pr-closed); }
    .sb-status { color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sb-unread {
      min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; text-align: center;
      background: var(--unread); color: var(--text-on-accent); font-size: var(--fs-caption); line-height: 16px;
    }
    .sb-close { opacity: 0; }
    .sb-row:hover .sb-close { opacity: 1; }
    .pane {
      position: absolute;
      overflow: hidden;
      padding: var(--2xs);
      border: 1px solid var(--hairline);
      background: var(--surface-0);
    }
    .pane.focused { border-color: var(--attention); }
    .pane .xterm { height: 100%; }
    /* Draggable splitters drawn over pane boundaries. */
    .divider { position: absolute; z-index: 5; background: transparent; }
    .divider:hover { background: var(--attention); opacity: 0.4; }
    .divider.vertical { width: 6px; margin-left: -3px; cursor: col-resize; }
    .divider.horizontal { height: 6px; margin-top: -3px; cursor: row-resize; }

    /* Capacity meter: 8-pip safe-zone bar + label + SAFE-ZONE chip, always visible (thesis). */
    #statusbar {
      flex-shrink: 0; display: flex; align-items: center; gap: var(--md);
      height: 26px; padding: 0 var(--sm); border-top: 1px solid var(--hairline);
      background: var(--surface-1); font-size: var(--fs-meta); color: var(--text-muted);
    }
    .cap { display: flex; align-items: center; gap: var(--sm); }
    .pips { display: inline-flex; gap: 2px; }
    .pip { width: 6px; height: 12px; border-radius: 1px; background: var(--surface-selected); }
    .pip.on { background: var(--capacity-calm); }
    .level-warn .pip.on { background: var(--capacity-warn); }
    .level-cap .pip.on { background: var(--capacity-cap); }
    .cap-label { color: var(--text-primary); }
    .chip {
      padding: 1px var(--sm); border-radius: 3px; font-size: var(--fs-caption);
      letter-spacing: 0.05em; color: var(--text-primary);
      border: 1px solid var(--capacity-calm);
    }
    .chip.level-warn { border-color: var(--capacity-warn); }
    .chip.level-cap { border-color: var(--capacity-cap); color: var(--capacity-cap); }

    /* Command palette (Ctrl+Shift+P): a filtered overlay over the chrome's actions. */
    #palette {
      position: fixed; inset: 0; z-index: 100; display: none;
      align-items: flex-start; justify-content: center; background: rgba(0, 0, 0, 0.35);
    }
    #palette.open { display: flex; }
    .pal-box {
      margin-top: 12vh; width: 480px; max-width: 90vw;
      background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 6px;
      overflow: hidden; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }
    .pal-input {
      width: 100%; box-sizing: border-box; padding: var(--sm) var(--md); border: none;
      background: var(--surface-2); color: var(--text-primary);
      font-family: var(--ui); font-size: var(--fs-body); outline: none;
    }
    .pal-list { max-height: 320px; overflow-y: auto; }
    .pal-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--xs) var(--md); cursor: pointer; font-size: var(--fs-body); color: var(--text-primary);
    }
    .pal-row.active { background: var(--surface-selected); }
    .pal-hint { color: var(--text-muted); font-size: var(--fs-caption); }
  </style>
</head>
<body>
  <nav id="sidebar"></nav>
  <div id="workarea">
    <div id="app"></div>
    <footer id="statusbar">
      <div id="cap-meter" class="cap level-calm">
        <span class="pips"></span>
        <span class="cap-label">— / — terminals</span>
      </div>
      <span id="safe-zone" class="chip level-calm">SAFE ZONE</span>
    </footer>
  </div>
  <div id="palette">
    <div class="pal-box">
      <input class="pal-input" type="text" placeholder="Type a command…" autocomplete="off" spellcheck="false" />
      <div class="pal-list"></div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
